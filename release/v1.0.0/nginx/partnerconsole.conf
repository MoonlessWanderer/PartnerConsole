# Stays inside the install folder until you choose to install it yourself.
# Replace REPLACE_WITH_HOSTNAME, @TLS_CERTIFICATE@, and @TLS_KEY@.
# Certificate files belong to the host TLS setup. This package does not create them.
# 8741 and 3741 stay on 127.0.0.1. Do not publish MySQL.
# X-Forwarded-For is replaced with the connected client, not appended.

server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_WITH_HOSTNAME;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name REPLACE_WITH_HOSTNAME;

    ssl_certificate @TLS_CERTIFICATE@;
    ssl_certificate_key @TLS_KEY@;

    client_max_body_size 64k;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8741;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding identity;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://127.0.0.1:3741;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
