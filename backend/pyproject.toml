[project]
name = "partner-console"
version = "1.0.5"
description = "Partner Console"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "httpx>=0.28.1,<0.29",
  "httpcore>=1.0.9,<1.1",
  "pyjwt>=2.10",
  "cryptography>=44.0",
  "jdatetime>=5.0",
  "psycopg[binary]>=3.2",
  "PyMySQL[rsa]==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = [".", "../dev", "../dev/tests/backend"]
testpaths = ["../dev/tests/backend"]
