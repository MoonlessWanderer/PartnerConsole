name: Candidate fresh Ubuntu install

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to validate, such as v1.0.10
        required: true
        type: string
      commit:
        description: Full commit SHA to validate on main
        required: true
        type: string

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build, audit and checksum the application package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$GITHUB_REF" != refs/heads/main || "$RELEASE_COMMIT" != "$GITHUB_SHA" || -z "$RELEASE_VERSION" ]]; then
              echo "::error::Manual release validation requires main, the full SHA selected for this run, and an explicit version."
              exit 1
            fi
          else
            RELEASE_VERSION=v1.0.10
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 dev/release/build.py "$GITHUB_SHA" "$RELEASE_VERSION" "$RUNNER_TEMP/assets"
          (cd "$RUNNER_TEMP/assets" && sha256sum --check --strict SHA256SUMS)
          tar -tzf "$RUNNER_TEMP/assets/partnerconsole-$RELEASE_VERSION.tar.gz" | LC_ALL=C sort > "$RUNNER_TEMP/actual"
          { printf 'PACKAGE.json\n'; cat dev/release/runtime-files.txt; } | LC_ALL=C sort > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          grep -Fx 'config/api.env.example' "$RUNNER_TEMP/actual"
          grep -Fx 'config/web.env.example' "$RUNNER_TEMP/actual"
          if grep -E '^(deploy/env/|release/)' "$RUNNER_TEMP/actual"; then
            echo "::error::The package contains an obsolete deployment path."
            exit 1
          fi
          ! grep -E '(^|/)(dev|tests|data|runtime|backups|\.git|\.github)(/|$)' "$RUNNER_TEMP/actual"
          mkdir -p "$RUNNER_TEMP/harness"
          cp dev/tests/installer/{fresh-install-linux-check.sh,install-recovery-linux-check.sh,release-http-fixture.sh,release-tty.py} "$RUNNER_TEMP/harness/"
          awk '/^## Install and update$/{on=1} on && /^\x60\x60\x60bash$/{code=1;next} code && /^\x60\x60\x60$/{exit} code{print}' README.md > "$RUNNER_TEMP/harness/user-install.sh"
          grep -Fxq 'sudo bash ./partnerconsole.sh install' "$RUNNER_TEMP/harness/user-install.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-${{ github.sha }}
          path: ${{ runner.temp }}/assets
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: harness-${{ github.sha }}
          path: ${{ runner.temp }}/harness
          if-no-files-found: error

  install:
    strategy:
      fail-fast: false
      matrix:
        source: [online, archive]
    needs: assets
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: package-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: harness-${{ github.sha }}
          path: ${{ runner.temp }}/harness
      - name: Remove the disposable runner's existing MySQL packages
        run: |
          sudo systemctl stop mysql || true
          { dpkg-query -W -f '${Package}\n' 'mysql-*' || true; } | xargs -r sudo apt-get purge -y
          sudo rm -rf /etc/mysql /var/lib/mysql /var/log/mysql
      - name: Install from an empty directory with no source checkout
        env:
          INSTALL_SOURCE: ${{ matrix.source }}
        run: |
          (cd "$RUNNER_TEMP/candidate" && sha256sum --check --strict SHA256SUMS)
          sudo PARTNERCONSOLE_DISPOSABLE_HOST=1 bash "$RUNNER_TEMP/harness/fresh-install-linux-check.sh" \
            "$RUNNER_TEMP/candidate" "$GITHUB_SHA" "$INSTALL_SOURCE"

  install-recovery:
    strategy:
      fail-fast: false
      matrix:
        scenario: [resume, download, checksum]
    needs: assets
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: package-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: harness-${{ github.sha }}
          path: ${{ runner.temp }}/harness
      - name: Remove the disposable runner's existing MySQL packages
        run: |
          sudo systemctl stop mysql || true
          { dpkg-query -W -f '${Package}\n' 'mysql-*' || true; } | xargs -r sudo apt-get purge -y
          sudo rm -rf /etc/mysql /var/lib/mysql /var/log/mysql
      - name: Exercise installation interruption and package failure through the user commands
        env:
          RECOVERY_SCENARIO: ${{ matrix.scenario }}
        run: |
          sudo PARTNERCONSOLE_DISPOSABLE_HOST=1 bash "$RUNNER_TEMP/harness/install-recovery-linux-check.sh" \
            "$RUNNER_TEMP/candidate" "$GITHUB_SHA" "$RECOVERY_SCENARIO"

  migration:
    strategy:
      fail-fast: false
      matrix:
        source: [online, archive]
    needs: assets
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Obtain the exact package used by fresh install
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: package-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-a
      - name: Verify the first candidate and build the second version
        run: |
          (cd "$RUNNER_TEMP/candidate-a" && sha256sum --check --strict SHA256SUMS)
          tag="$(sed -n 's/^RELEASE_TAG="\(.*\)"$/\1/p' "$RUNNER_TEMP/candidate-a/partnerconsole.sh")"
          next="$(python3 -c 'import sys; a,b,c=map(int,sys.argv[1][1:].split(".")); print(f"v{a}.{b}.{c+1}")' "$tag")"
          python3 dev/release/build.py "$GITHUB_SHA" "$next" "$RUNNER_TEMP/candidate-b"
      - name: Remove the disposable runner's existing MySQL packages
        run: |
          sudo systemctl stop mysql || true
          { dpkg-query -W -f '${Package}\n' 'mysql-*' || true; } | xargs -r sudo apt-get purge -y
          sudo rm -rf /etc/mysql /var/lib/mysql /var/log/mysql
      - name: Install the pinned browser driver
        run: npm install --prefix "$RUNNER_TEMP/upgrade-browser" --no-save --package-lock=false --no-audit --no-fund playwright-core@1.56.1
      - name: Upgrade public v1.0.9 through the selected source, purchase, and restore
        env:
          UPGRADE_SOURCE: ${{ matrix.source }}
        run: |
          sudo PARTNERCONSOLE_DISPOSABLE_HOST=1 BROWSER_USER="$(id -un)" \
            PLAYWRIGHT_MODULE="$RUNNER_TEMP/upgrade-browser/node_modules/playwright-core" \
            bash dev/tests/installer/release-migration-linux-check.sh \
            "$RUNNER_TEMP/candidate-a" "$RUNNER_TEMP/candidate-b" "$UPGRADE_SOURCE"
