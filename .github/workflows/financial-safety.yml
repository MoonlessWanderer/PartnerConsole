name: Financial consent Linux validation

on:
  push:
    branches: [main, 'release-validation/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  suites:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - run: |
          python -m pip install -e './backend[dev]'
          cd backend
          DATABASE_URL=sqlite:// python -m pytest -q
      - run: |
          npm ci --no-audit --no-fund
          npm run test:frontend
          npm run typecheck
      - run: |
          files=(partnerconsole.sh install.sh start.sh stop.sh restart.sh status.sh scripts/*.sh dev/tests/installer/*.sh)
          for file in "${files[@]}"; do bash -n "$file"; done
          shellcheck -x -S warning "${files[@]}"

  chromium-mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: [baseline, hotfix]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Real FastAPI, Next.js and MySQL 8.4 with local V2Board
        env:
          AUDIT_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          umask 077
          app="$RUNNER_TEMP/application"
          mkdir -p "$app" "$RUNNER_TEMP/financial-evidence"
          if [[ "$AUDIT_VERSION" == baseline ]]; then
            fixtures="$GITHUB_WORKSPACE/dev/tests/fixtures/upgrade"
            (cd "$fixtures" && sha256sum --check --strict SHA256SUMS)
            tar -xzf "$fixtures/v1.0.3.tar.gz" -C "$app"
          else
            git archive HEAD | tar -x -C "$app"
          fi
          db_password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          docker run --detach --name pc-consent-db --publish 127.0.0.1:13306:3306 \
            -e MYSQL_RANDOM_ROOT_PASSWORD=yes -e MYSQL_DATABASE=partnerconsole \
            -e MYSQL_USER=fixture -e "MYSQL_PASSWORD=$db_password" mysql:8.4
          for attempt in {1..60}; do
            if docker exec -e "MYSQL_PWD=$db_password" pc-consent-db mysql --protocol=tcp -h 127.0.0.1 -u fixture partnerconsole -N -e 'SELECT VERSION()' | grep -q '^8\.4\.'; then break; fi
            if [[ "$attempt" == 60 ]]; then exit 1; fi
            sleep 2
          done
          python -m pip install -e "$app/backend"
          export DATABASE_URL="mysql+pymysql://fixture:$db_password@127.0.0.1:13306/partnerconsole"
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(36))')"
          export ADMIN_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          export ADMIN_USERNAME=fixture_admin
          export CORS_ORIGINS=http://127.0.0.1:13741 PANEL_PRIVATE_ORIGINS=http://127.0.0.1:18788
          export NEXT_PUBLIC_API_BASE=http://127.0.0.1:18741 NEXT_TELEMETRY_DISABLED=1
          export PYTHONPATH="$app/backend:$GITHUB_WORKSPACE/dev:$GITHUB_WORKSPACE/dev/tests/backend"
          cd "$app"
          npm ci --no-audit --no-fund
          npm run build
          npm install --no-save --package-lock=false --no-audit --no-fund playwright-core@1.56.1
          export PLAYWRIGHT_MODULE="$app/node_modules/playwright-core"
          python -m uvicorn financial_panel_lab:app --host 127.0.0.1 --port 18788 --no-access-log >"$RUNNER_TEMP/mock.log" 2>&1 &
          mock_pid=$!
          python -m uvicorn app.main:app --host 127.0.0.1 --port 18741 --no-access-log >"$RUNNER_TEMP/api.log" 2>&1 &
          api_pid=$!
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 13741 >"$RUNNER_TEMP/web.log" 2>&1 &
          web_pid=$!
          trap 'kill "$mock_pid" "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          node "$GITHUB_WORKSPACE/dev/tests/frontend/financial-consent-browser.cjs" "$AUDIT_VERSION" "$RUNNER_TEMP/financial-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: consent-${{ matrix.version }}-sanitized-evidence
          path: ${{ runner.temp }}/financial-evidence

  mysql-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: MySQL integration and failure recovery
        run: |
          root_password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          test_password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          docker run --detach --name pc-release-db --publish 127.0.0.1:13306:3306 \
            -e "MYSQL_ROOT_PASSWORD=$root_password" mysql:8.4
          mysql_root() {
            docker exec -i -e "MYSQL_PWD=$root_password" pc-release-db mysql --protocol=tcp -u root "$@"
          }
          for attempt in {1..60}; do
            if mysql_root -N -e 'SELECT VERSION()' | grep -q '^8\.4\.'; then break; fi
            if [[ "$attempt" == 60 ]]; then exit 1; fi
            sleep 2
          done
          mysql_root <<SQL
          CREATE DATABASE partnerpanel_test_release;
          CREATE DATABASE partnerpanel_test_integration;
          CREATE USER 'fixture'@'%' IDENTIFIED BY '$test_password';
          GRANT ALL ON \`partnerpanel\_test\_%\`.* TO 'fixture'@'%';
          SQL
          python -m pip install -e './backend[dev]'
          export PARTNERPANEL_MYSQL_TEST_ALLOW_SCHEMA_WRITES=isolated-schema-approved
          cd backend
          for suite in integration release; do
            export PARTNERPANEL_MYSQL_TEST_URL="mysql+pymysql://fixture:$test_password@127.0.0.1:13306/partnerpanel_test_$suite"
            if [[ "$suite" == integration ]]; then
              python -m pytest -c pyproject.toml -q ../dev/tests/backend/test_mysql_integration.py
            else
              python -m pytest -c pyproject.toml -q ../dev/tests/backend/test_mysql_release_validation.py
            fi
          done
